apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: payops-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: abdalrhman1/payops-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: payops
            - name: DB_USER
              value: payops_admin
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-secrets
                  key: DB_PASSWORD
            - name: REDIS_URL
              value: redis://redis:6379
            - name: MOCK_STRIPE_URL
              value: http://mock-psp:4001
            - name: MOCK_PAYMO_URL
              value: http://mock-psp:4002
            - name: LOCAL_STORAGE_PATH
              value: /app/storage/invoices
          volumeMounts:
            - name: storage
              mountPath: /app/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: invoice-storage
