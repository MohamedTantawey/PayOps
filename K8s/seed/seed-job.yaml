apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: payops-control
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: abdalrhman1/payops-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "backend/src/shared/seed.js"]
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: payops
            - name: DB_USER
              value: payops_admin
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-secrets
                  key: DB_PASSWORD
            - name: REDIS_URL
              value: redis://redis:6379
