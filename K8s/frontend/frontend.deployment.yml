apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: payops-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: abdalrhman1/payops-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
